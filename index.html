<!DOCTYPE html>
<html lang='en-US'>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pathways Planner</title>
        <link rel="stylesheet" href="styles.css">

        <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
        <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
        <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>
        
        <script src="program_parser.js" defer></script>
        
    </head>
    <body onload="initialize()">
        <div id="body-wrapper">
            <div id="header">
                <img src="logo.png" alt="Pathways Planner Logo" id="logo">
                <h1 id="heading">Pathways Planner</h1>
                <button id="togglePanel" class="headerBtns" onclick="togglePanel()">&and;</button>

            </div>
            <div id="controlPanel">
                <div id="selects">
                    <label for="mainMajorSelect">Select Major:</label>
                    <select id="mainMajorSelect" onchange="grabCourses(id)">
                    </select>

                    <!-- For Double Major Selection -->
                    <label for="doubleMajorSelect">Select 2nd Major:</label>
                    <select id="doubleMajorSelect" onchange="grabCourses(id)">       
                    </select> 

                    <!-- For Minor Selection -->
                    <label for="minorSelect">Select Minor:</label>
                    <select id="minorSelect" onchange="grabCourses(id)">
                    </select>
                </div>

                <div id="semesterStuff">
                    <label for="semesterSlider">Select Current Semester: </label>
                    <span id="semesterValue">1</span>
                    <input type="range" id="semesterSlider" min="1" max="8" value="1" oninput="updateSemesterLabel()">
                </div>
                <!-- <label for="searchInput">Type in your secret password to retrieve your previous plan:</label>  -->
                <!-- Type in your secret password to retrieve your previous plan:
                <input type="text" id="passwordfield" placeholder="Type in password here"> -->

                <!-- <hr/> -->

                <div class="panelBtns">
                    <button id="saveBtn" class="tableBtns" onclick="savePlan()">Save Plan</button>
                    <button id="loadBtn" class="tableBtns" onclick="loadPlan()">Load Plan</button>
                    <button id="addColBtn" class="tableBtns" onclick="customAddColumn()">Add Column</button>
                </div>


            </div>
            <div id="mainBody">
                <!-- This is where the schedule tables get created -->
                 <div id="GERS-wrapper"></div>
                <div id="mainMajor-wrapper"></div>
                <div id="doubleMajor-wrapper"></div>
                <div id="minor-wrapper"></div>
                <!-- class="tableGroup"> -->
            </div>
            
            <div id="footer">
                <p>Pathways Planner © 2025</p>
            </div>
        </div>
    </body>
</html>
