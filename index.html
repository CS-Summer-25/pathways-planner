<!DOCTYPE html>
<html lang='en-US'>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pathways Planner</title>
        <link rel="stylesheet" href="styles.css">

        <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
        <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
        <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>
        
        <script src="program_parser.js" defer></script>
        
    </head>
    <body onload="initialize()">
        <div id="body-wrapper">
            <div id="header">
                <img src="imgs/logo.png" alt="Pathways Planner Logo" id="logo">
                <h1 id="heading">Pathways Planner</h1>
                <!-- <input type="button" id="togglePanel" class="toggleBtn" onclick="togglePanel()"></button> -->
                <div id="switchContainer">
                    <span id="switchLabel">Toggle Panel</span>
                    <label class="switch">
                        <input type="checkbox" onclick="togglePanel()">
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
            <div id="controlPanel">
                <div id="selects">
                    <label for="mainMajorSelect">Select Major:</label>
                    <select id="mainMajorSelect" onchange="grabCourses(id)">
                    </select>

                    <!-- For Double Major Selection -->
                    <label for="doubleMajorSelect">Select 2nd Major:</label>
                    <select id="doubleMajorSelect" onchange="grabCourses(id)">       
                    </select> 

                    <!-- For Minor Selection -->
                    <label for="minorSelect">Select Minor:</label>
                    <select id="minorSelect" onchange="grabCourses(id)">
                    </select>
                </div>

                <div id="semesterStuff">
                    <label for="semesterSlider">Select Current Semester: </label>
                    <span id="semesterValue">1</span>
                    <input type="range" id="semesterSlider" min="1" max="8" step="1" value="1" list="semesterList" oninput="updateSemesterLabel()">
                        <datalist id="semesterList">
                            <option value="1">|</option>
                            <option value="2">|</option>
                            <option value="3">|</option>
                            <option value="4">|</option>
                            <option value="5">|</option>
                            <option value="6">|</option>
                            <option value="7">|</option>
                            <option value="8">|</option>
                        </datalist>
                </div>
                <!-- <label for="searchInput">Type in your secret password to retrieve your previous plan:</label>  -->
                <!-- Type in your secret password to retrieve your previous plan:
                <input type="text" id="passwordfield" placeholder="Type in password here"> -->

                <!-- <hr/> -->

                <div id="panelBtnContainer">
                    <button id="saveBtn" class="panelBtns" onclick="savePlan()">Save Plan</button>
                    <button id="loadBtn" class="panelBtns" onclick="loadPlan()">Load Plan</button>
                    <button id="addColBtn" class="panelBtns" onclick="customAddColumn()">Add Column</button>
                </div>


            </div>
            <div id="mainBody">
                <!-- This is where the schedule tables get created -->
                 <div id="GERS-wrapper"></div>
                <div id="mainMajor-wrapper"></div>
                <div id="doubleMajor-wrapper"></div>
                <div id="minor-wrapper"></div>
                <!-- class="tableGroup"> -->
            </div>
            
            <div id="footer">
                <p>Pathways Planner © 2025</p>
            </div>
        </div>
    </body>
</html>
